<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REO.com</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    header {
      background: white;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .hero {
      padding: 80px 20px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #666;
    }

    .foto {
      margin: 30px auto;
      width: 80%;
      max-width: 700px;
      height: 300px;
      border: 2px dashed #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      background: white;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>REO.com</h1>
  </header>

  <section class="hero">
    <h2>Hoş Geldiniz</h2>
    <p>REO.com kişisel web sitem.</p>

    <div class="foto">
      Buraya fotoğraflarımı ekleyeceğim 📷
    </div>
  </section>

  <footer>
    © 2026 REO.com
  </footer>

</body>
</html>
